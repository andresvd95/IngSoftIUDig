services:
  mysql-db:
    image: mysql:8.0
    container_name: autos-colombia-db
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: autoscolombia
      MYSQL_USER: admin
      MYSQL_PASSWORD: 12345
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uadmin", "-p12345"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./autos-colombia
    image: autos-colombia-backend:local
    container_name: autos-colombia-backend
    environment:
      AUTOS_COLOMBIA_DB_HOSTNAME: mysql-db
      AUTOS_COLOMBIA_DB_PORT: 3306
      AUTOS_COLOMBIA_DB_NAME: autoscolombia
      AUTOS_COLOMBIA_DB_USERNAME: admin
      AUTOS_COLOMBIA_DB_PASSWORD: 12345
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    image: autos-colombia-frontend:local
    build:
      context: ./frontend
    container_name: autos-colombia-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  mysql_data:
