services:
  frontend:
    image: autos-colombia-frontend:local
    build:
      context: ./frontend
    container_name: autos-colombia-frontend
    ports:
      - "4200:80"
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
