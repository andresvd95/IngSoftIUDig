version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: autos-colombia
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: autoscolombia
      MYSQL_USER: admin
      MYSQL_PASSWORD: 12345
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data: