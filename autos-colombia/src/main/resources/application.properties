spring.application.name=autos-colombia

# Database connection
spring.datasource.url=jdbc:mysql://${AUTOS_COLOMBIA_DB_HOSTNAME}:${AUTOS_COLOMBIA_DB_PORT}/${AUTOS_COLOMBIA_DB_NAME}?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${AUTOS_COLOMBIA_DB_USERNAME}
spring.datasource.password=${AUTOS_COLOMBIA_DB_PASSWORD}

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.user=${AUTOS_COLOMBIA_DB_USERNAME}
spring.flyway.password=${AUTOS_COLOMBIA_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.databaseName=${AUTOS_COLOMBIA_DB_NAME}
spring.flyway.table=schema_version
spring.flyway.sql-migration-prefix=AC